name: Build iOS dev app (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Generate iOS native project
        run: npx expo prebuild --platform ios --no-install

      # The app is useless without these native modules — fail fast if the
      # autolinker loses any of them (happened once with a version mismatch).
      - name: Verify native modules are autolinked
        run: |
          set -euo pipefail
          RESOLVED=$(npx expo-modules-autolinking resolve -p apple)
          for mod in ExpoSpeechRecognition ExpoMLKitTranslate AudioRoute; do
            echo "$RESOLVED" | grep -q "$mod" || { echo "::error::$mod missing from autolinking!"; exit 1; }
            echo "$mod: OK"
          done

      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: ios

      - name: Verify native modules are in the Podfile.lock
        run: |
          set -euo pipefail
          for pod in ExpoSpeechRecognition ExpoMLKitTranslate AudioRoute; do
            grep -q "$pod" ios/Podfile.lock || { echo "::error::$pod missing from Podfile.lock!"; exit 1; }
            echo "$pod: OK"
          done

      # Debug configuration on purpose: it produces the dev-client launcher
      # that connects to the Metro server on the PC for live development.
      # Signing is disabled — Sideloadly re-signs the IPA with a free Apple ID.
      - name: Build unsigned app
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building scheme: $SCHEME"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 50

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(ls -d build/Build/Products/Debug-iphoneos/*.app | head -n1)
          echo "Packaging: $APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry translator-dev.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: translator-dev-ipa
          path: translator-dev.ipa
          retention-days: 30
